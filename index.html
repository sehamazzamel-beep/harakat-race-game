/* layout: full-bleed canvas race scene; chunky HUD band on top, answer deck pinned to the bottom like a game console */
:root{
  --ink:#1D2547;
  --paper:#FFF9EE;
  --orange:#FF8A1F; --orange-d:#C9600A;
  --blue:#2F8BFF;   --blue-d:#1C5FC2;
  --purple:#9B5CF6; --purple-d:#6A35C4;
  --green:#2DB86A;  --green-d:#1D8549;
  --gold:#FFC23D;   --gold-d:#D58F00;
  --bad:#F0504A;
  --sky:#62C9FF;
  --font:"AlBayan","Geeza Pro","Noto Naskh Arabic","Arabic Typesetting",serif;
  --card:clamp(78px, min(26vw, 17vh), 136px);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{direction:rtl;margin:0;background:var(--sky);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.roundbtn{width:48px;height:48px;border-radius:50%;background:var(--paper);display:grid;place-items:center;
  box-shadow:0 4px 0 rgba(29,37,71,.35);flex:none;transition:transform .08s}
.roundbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(29,37,71,.35)}
.roundbtn svg{width:24px;height:24px}
#track{flex:1;min-width:0;height:22px;border-radius:12px;background:rgba(255,255,255,.55);
  box-shadow:inset 0 2px 0 rgba(29,37,71,.15);display:flex;gap:4px;padding:4px;direction:rtl;position:relative}
#track .seg{flex:1;border-radius:7px;background:rgba(29,37,71,.12);transition:background .35s}
#track .seg.on{background:linear-gradient(#5BE08E,#22A85C)}
#track .seg.on:last-child{background:linear-gradient(#FFD86B,#F2A300)}
#coinBox{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);left:max(16px,env(safe-area-inset-left,0px));z-index:5;
  display:flex;align-items:center;gap:6px;background:rgba(29,37,71,.78);color:#FFE27A;font-weight:700;font-size:20px;line-height:1;
  padding:4px 12px 6px 6px;border-radius:22px;direction:ltr}
#coinBox i{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3B0,#FFC23D 55%,#D58F00);
  box-shadow:inset 0 0 0 3px #E8A50C;display:block}
#coinBox.pop{animation:coinpop .25s}
@keyframes coinpop{50%{transform:scale(1.18)}}
.res-coins{display:inline-flex;align-items:center;gap:8px;background:#FFF0C7;border-radius:18px;padding:4px 14px 7px;font-size:20px;font-weight:700;margin:0 0 16px}
.res-coins i{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3B0,#FFC23D 55%,#D58F00);box-shadow:inset 0 0 0 3px #E8A50C;display:block}
#levelTag{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(29,37,71,.72);color:#fff;font-size:15px;font-weight:700;padding:3px 12px 5px;border-radius:20px;z-index:5}

/* Deck */
#deck{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
#deck.away{transform:translateY(130%)}
#cards{display:flex;gap:clamp(10px,3vw,22px);direction:ltr}
.card{width:var(--card);height:var(--card);border-radius:24px;background:var(--paper);position:relative;
  border:6px solid var(--c);box-shadow:0 8px 0 var(--cd),0 12px 18px rgba(0,0,0,.18);
  font-size:calc(var(--card) * .5);font-weight:700;line-height:1;display:grid;place-items:center;
  transition:transform .12s, opacity .25s, filter .25s}
.card span{display:block;transform:translateY(-6%)}
.card:active{transform:translateY(5px);box-shadow:0 3px 0 var(--cd)}
.card.picked{transform:translateY(-8px) scale(1.06);box-shadow:0 14px 0 var(--cd),0 0 0 6px #fff}
.card.wrong{opacity:.45;filter:grayscale(.8);animation:shake .45s}
.card.right{animation:pulse .6s}
.c0{--c:var(--orange);--cd:var(--orange-d)}
.c1{--c:var(--blue);--cd:var(--blue-d)}
.c2{--c:var(--purple);--cd:var(--purple-d)}
#speak{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFE08A,var(--gold) 60%);
  box-shadow:0 5px 0 var(--gold-d),0 8px 14px rgba(0,0,0,.2);display:grid;place-items:center;transition:transform .1s}
#speak svg{width:30px;height:30px}
#speak:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-d)}
#speak.talking{animation:talk .5s infinite alternate}

/* Feedback */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%) scale(.6);opacity:0;
  font-size:clamp(28px,7vw,44px);font-weight:700;color:#fff;padding:4px 26px 10px;border-radius:40px;z-index:6;
  pointer-events:none;white-space:nowrap;transition:opacity .2s, transform .3s cubic-bezier(.3,1.6,.5,1)}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
#toast.good{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
#toast.bad{background:var(--bad);box-shadow:0 5px 0 #B8302B}
#pop{position:fixed;left:50%;top:38%;z-index:6;pointer-events:none;transform:translate(-50%,-50%)}
#pop .pc{background:var(--paper);border:8px solid var(--c,#2F8BFF);border-radius:36px;
  width:clamp(150px,40vw,230px);height:clamp(150px,40vw,230px);display:grid;place-items:center;
  font-size:clamp(84px,24vw,140px);font-weight:700;box-shadow:0 12px 0 var(--cd,#1C5FC2),0 20px 40px rgba(0,0,0,.25);
  animation:popIn 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
#pop .pc span{transform:translateY(-6%)}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;overflow-y:auto;
  background:linear-gradient(rgba(29,37,71,.15),rgba(29,37,71,.55));
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:var(--paper);border-radius:34px;width:min(560px,100%);padding:22px clamp(16px,4vw,30px) 26px;
  box-shadow:0 10px 0 rgba(29,37,71,.35),0 30px 60px rgba(0,0,0,.25);text-align:center;animation:rise .5s cubic-bezier(.2,1.3,.4,1)}
.kicker{display:inline-block;background:var(--gold);color:var(--ink);font-weight:700;font-size:15px;padding:2px 14px 5px;border-radius:20px;box-shadow:0 3px 0 var(--gold-d)}
h1{font-size:clamp(46px,13vw,78px);line-height:1.15;margin:6px 0 2px;font-weight:700;color:var(--blue);
  text-shadow:0 4px 0 var(--blue-d),0 7px 0 rgba(29,37,71,.2);text-wrap:balance}
.lead{font-size:clamp(17px,4.4vw,21px);margin:4px auto 18px;max-width:30ch;line-height:1.6;font-weight:400}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.level{border-radius:24px;background:var(--c);color:#fff;padding:12px 10px 14px;box-shadow:0 7px 0 var(--cd);
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s;min-width:0}
.level:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.level .sample{background:var(--paper);color:var(--ink);border-radius:16px;font-size:clamp(28px,8vw,40px);font-weight:700;
  padding:0 12px 6px;line-height:1.5;width:100%;direction:rtl;word-spacing:.2em}
.level .name{font-size:clamp(17px,4.6vw,21px);font-weight:700;margin-top:6px}
.level .desc{font-size:14px;opacity:.92}
.level .best{font-size:16px;letter-spacing:2px;color:#FFE27A;min-height:20px}
.lv-short{--c:var(--orange);--cd:var(--orange-d)}
.lv-long{--c:var(--blue);--cd:var(--blue-d)}
.lv-mix{--c:var(--purple);--cd:var(--purple-d)}
.lv-similar{--c:var(--green);--cd:var(--green-d)}
.note{margin:16px 0 0;font-size:15px;line-height:1.6;background:#FFF0C7;border-radius:14px;padding:8px 12px 10px}
.stars{font-size:clamp(54px,15vw,76px);letter-spacing:6px;margin:4px 0;line-height:1.2}
.stars i{font-style:normal;color:#E3DCCD;display:inline-block}
.stars i.on{color:var(--gold);text-shadow:0 4px 0 var(--gold-d);animation:starIn .5s both}
.stars i:nth-child(2){animation-delay:.25s}.stars i:nth-child(3){animation-delay:.5s}
.res-line{font-size:20px;margin:2px 0 18px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.big{font-size:21px;font-weight:700;color:#fff;background:var(--c);box-shadow:0 6px 0 var(--cd);border-radius:20px;padding:8px 22px 12px;min-width:140px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cd)}

@keyframes shake{0%,100%{translate:0}20%{translate:-9px}40%{translate:8px}60%{translate:-6px}80%{translate:4px}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes talk{to{transform:scale(1.1)}}
@keyframes popIn{0%{transform:scale(.2) rotate(-12deg);opacity:0}25%{transform:scale(1.1) rotate(4deg);opacity:1}40%{transform:scale(1) rotate(0)}80%{transform:scale(1);opacity:1}100%{transform:scale(.6) translateY(-120px);opacity:0}}
@keyframes rise{from{transform:translateY(40px) scale(.95);opacity:0}}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Race start screen */
.overlay.start{display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;place-items:unset;
  background:linear-gradient(rgba(20,26,56,.55),rgba(20,26,56,0) 34%,rgba(20,26,56,0) 58%,rgba(20,26,56,.6))}
.start-top{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:54px;animation:drop .7s cubic-bezier(.2,1.3,.4,1)}

const sndCache={};let curSnd=null;
function playSyl(text){if(muted)return;const src=SND[text];if(!src){say(text);return}
  try{speechSynthesis.cancel()}catch(e){}
  if(curSnd){curSnd.pause();curSnd.currentTime=0}
  const a=sndCache[src]||(sndCache[src]=new Audio(src));curSnd=a;a.currentTime=0;
  a.onplay=()=>speakBtn.classList.add('talking');a.onended=a.onpause=()=>speakBtn.classList.remove('talking');
  a.play().catch(()=>say(text))}
function preload(list){list.forEach(t=>{const s=SND[t];if(s&&!sndCache[s]){const a=new Audio();a.preload='auto';a.src=s;sndCache[s]=a}})}
function say(text,rate=.7,onEnd){if(muted||!('speechSynthesis' in window)){onEnd&&onEnd();return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=voice?voice.lang:'ar-SA';if(voice)u.voice=voice;u.rate=rate;u.pitch=1.08;
  u.onstart=()=>speakBtn.classList.add('talking');u.onend=u.onerror=()=>{speakBtn.classList.remove('talking');onEnd&&onEnd()};speechSynthesis.speak(u)}catch(e){}}

/* ---------- State ---------- */
const CARZ=2, STOP=4.2, CRUISE=10, RH=1.5, CURB=.2, ZMIN=.6, ZFAR=110, SPAWN=34;
const COLORS=[['#FF8A1F','#C9600A'],['#2F8BFF','#1C5FC2'],['#9B5CF6','#6A35C4']];
const S={mode:'menu',start:{z:7},lights:0,level:null,round:0,mistakes:0,dist:0,speed:0,carX:0,lane:1,gate:null,chosen:-1,finish:null,t:0,shake:0,boost:0};
const parts=[];
let coins=[];S.coins=0;S.raceCoins=0;S.roundWrong=0;
let totalCoins=0;try{totalCoins=+localStorage.getItem('sibaq-coins')||0}catch(e){}
const num=n=>n.toLocaleString('ar-EG');
function showCoins(){const v=(S.mode==='menu'||S.mode==='done')?totalCoins:S.raceCoins;document.getElementById('coinNum').textContent=num(v)}
/* after a gate is passed, a trail of coins appears in the middle lane; first-try answers earn more */
function spawnCoins(fromZ){const n=S.roundWrong?4:8;for(let k=0;k<n;k++)coins.push({z:fromZ+6+k*1.5,x:0,got:false,t:Math.random()*6})}
function collect(c){c.got=true;S.raceCoins++;tone(1319,.09,'square',.07);tone(1760,.12,'square',.06,.06);
  const s=P/CARZ,x=cx+(c.x-S.camX)*s,y=carBottom-carW*.55;
  for(let k=0;k<6;k++)parts.push({x,y,vx:(Math.random()-.5)*300,vy:-200-Math.random()*250,r:0,vr:(Math.random()-.5)*8,sz:8+Math.random()*8,c:'#FFD43D',life:.6,type:'star'});
  showCoins();const b=document.getElementById('coinBox');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}
function drawCoin(c,camX){const z=c.z-S.dist;if(z<ZMIN||z>60)return;const s=P/z,x=cx+(c.x-camX)*s,yG=projY(z),r=.2*s,y=yG-.42*s+Math.sin(S.t*5+c.t)*.04*s;
  ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(x,yG,r*.9,r*.25,0,0,7);ctx.fill();
  const w=Math.max(.15,Math.abs(Math.cos(S.t*4+c.t)));
  ctx.fillStyle='#D58F00';ctx.beginPath();ctx.ellipse(x,y,r*w,r,0,0,7);ctx.fill();
  ctx.fillStyle='#FFC23D';ctx.beginPath();ctx.ellipse(x,y,r*w*.82,r*.82,0,0,7);ctx.fill();
  ctx.fillStyle='#FFF3B0';ctx.beginPath();ctx.ellipse(x-r*w*.25,y-r*.3,r*w*.22,r*.22,0,0,7);ctx.fill()}

function showPop(txt,i){const p=$('pop');$('popText').textContent=txt;const pc=p.firstElementChild;pc.style.setProperty('--c',COLORS[i][0]);pc.style.setProperty('--cd',COLORS[i][1]);

/* ---------- Flow ---------- */
const GRID=5; /* the car waits with the start gantry this far ahead */
let countTimers=[];
function setMode(m){S.mode=m;document.body.dataset.mode=m;showCoins()}
function startLevel(lv){audio();S.level=lv;S.round=0;S.mistakes=0;S.raceCoins=0;coins=[];S.finish=null;S.gate=null;bags={};setProgress();
  $('menu').hidden=true;$('results').hidden=true;$('levelTag').hidden=false;$('levelTag').textContent=LEVEL_NAMES[lv];
  $('deck').classList.add('away');sfx.tap();
  if(!S.start||S.start.z-S.dist<GRID-.5)S.start={z:S.dist+GRID+16};
  S.lights=0;setMode('grid')}
function countdown(){setMode('count');const c=$('count'),lights=[...c.querySelectorAll('i')],txt=$('countText');
  lights.forEach(l=>l.className='');txt.textContent='';txt.className='';c.hidden=false;
  const nums=['٣','٢','١'];
  for(let i=0;i<3;i++)countTimers.push(setTimeout(()=>{lights[i].className='red';S.lights=i+1;txt.textContent=nums[i];
    txt.className='';void txt.offsetWidth;txt.style.animation='pulse .4s';tone(523,.25,'square',.08);S.shake=.25},400+i*800));
  countTimers.push(setTimeout(()=>{lights.forEach(l=>l.className='green');S.lights=4;txt.textContent='انطلق!';txt.className='go';
    tone(1046,.5,'square',.1);sfx.whoosh();S.boost=1;setMode('play');setTimeout(nextRound,900)},400+3*800));
  countTimers.push(setTimeout(()=>{c.hidden=true},400+3*800+900))}
function nextRound(){if(S.mode!=='play')return;const r=genRound(S.level);S.roundWrong=0;
  S.gate={z:S.dist+SPAWN,opts:r.opts,answer:r.answer,wrong:new Set(),shake:[0,0,0],broken:-1,done:false};
  S.chosen=-1;S.lane=1;
  preload(r.opts);
  cards.forEach((c,i)=>{c.className='card c'+i;c.firstElementChild.textContent=show(r.opts[i]);c.disabled=false});
  $('deck').classList.remove('away');
  setTimeout(sayTarget,700)}
function sayTarget(){if(S.gate&&!S.gate.done)playSyl(S.gate.opts[S.gate.answer])}
function choose(i){const g=S.gate;if(S.mode!=='play'||!g||g.done||S.chosen>=0||g.wrong.has(i))return;
  S.chosen=i;S.lane=i;cards[i].classList.add('picked');sfx.tap();sfx.whoosh()}
function hitGate(){const g=S.gate,i=S.chosen;
  if(i===g.answer){g.done=true;g.broken=i;burst(i);sfx.chime();S.round++;setProgress();S.boost=1;spawnCoins(g.z);setTimeout(()=>{if(S.mode==='play')S.lane=1},250);
    cards[i].classList.remove('picked');cards[i].classList.add('right');cards.forEach(c=>c.disabled=true);
    showPop(show(g.opts[i]),i);toast(rnd(PRAISE),'good');
    if(S.round>=TOTAL){$('deck').classList.add('away');S.finish={z:S.dist+26}}else setTimeout(nextRound,1500)}
  else{g.wrong.add(i);g.shake[i]=1;S.roundWrong++;S.speed=-9;S.shake=1;S.mistakes++;sfx.bump();
    cards[i].classList.remove('picked');cards[i].classList.add('wrong');cards[i].disabled=true;S.chosen=-1;
    toast('حاول مرة أخرى','bad');setTimeout(sayTarget,900)}}
function finishRace(){setMode('done');totalCoins+=S.raceCoins;try{localStorage.setItem('sibaq-coins',totalCoins)}catch(e){}sfx.fanfare();confetti();
  const st=S.mistakes<=1?3:S.mistakes<=4?2:1;
  try{const k='sibaq-best-'+S.level;if(st>(+localStorage.getItem(k)||0))localStorage.setItem(k,st)}catch(e){}
  setTimeout(()=>{$('results').hidden=false;$('levelTag').hidden=true;
    [...$('stars').children].forEach((s,i)=>s.className=i<st?'on':'');
    $('resTitle').textContent=st===3?'بطل السباق!':st===2?'سباق رائع!':'أحسنت المحاولة!';
    $('resCoins').textContent='جمعت '+num(S.raceCoins)+' قطعة نقود · مجموعك '+num(totalCoins);showCoins();
    $('resLine').textContent=S.mistakes===0?'عبرت كل البوابات بلا أي خطأ':'عبرت '+num(TOTAL)+' بوابات · الأخطاء: '+num(S.mistakes);
    },900)}
function toMenu(){coins=[];setTimeout(showCoins,0);countTimers.forEach(clearTimeout);countTimers=[];$('count').hidden=true;setMode('menu');S.lights=0;if(!S.start||S.start.z-S.dist<GRID)S.start={z:S.dist+GRID+22};S.gate=null;S.finish=null;S.chosen=-1;S.lane=1;$('deck').classList.add('away');$('results').hidden=true;$('levelTag').hidden=true;
  $('menu').hidden=false;loadBest();S.round=0;setProgress();try{speechSynthesis.cancel()}catch(e){}}

addEventListener('keydown',e=>{if(e.key==='1'||e.key==='ArrowLeft')choose(0);else if(e.key==='2'||e.key==='ArrowDown')choose(1);else if(e.key==='3'||e.key==='ArrowRight')choose(2);else if(e.key===' '){e.preventDefault();sayTarget()}});

/* ---------- Canvas scene ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
let W,H,DPR,hy,K,P,carBottom,carW,cx;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  const deck=$('deck');const wasAway=deck.classList.contains('away');deck.style.transition='none';deck.classList.remove('away');
  const top=deck.getBoundingClientRect().top;if(wasAway)deck.classList.add('away');void deck.offsetWidth;deck.style.transition='';
  hy=Math.max(H*.3,110);carBottom=Math.min(top-14,H*.82);K=CARZ*(carBottom-hy);
  carW=Math.min(W*.22,150,(carBottom-hy)*.5);P=carW*CARZ/.66;cx=W/2;buildCity()}
const projY=z=>hy+K/z;

let city=[],hills=[];
function buildCity(){city=[];let x=-60;const pal=['#FF7FA0','#FFB547','#7ED957','#5BA8FF','#B48CFF','#FFE066','#4ECDC4','#FF8C6B'];
  let seed=7;const r=()=>(seed=(seed*9301+49297)%233280)/233280;
  while(x<W+60){const w=24+r()*48,h=(30+r()*90)*Math.min(1.4,H/700);city.push({x,w,h,c:pal[Math.floor(r()*pal.length)]});x+=w+2+r()*10}
  hills=[];for(let i=0;i<7;i++)hills.push({x:(i/6)*W+r()*40-20,r:W*.12+r()*W*.1})}
const clouds=[...Array(5)].map((_,i)=>({x:Math.random(),y:.05+Math.random()*.16,s:.6+Math.random()*.7,v:.004+Math.random()*.006}));

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function drawSky(camX){const g=ctx.createLinearGradient(0,0,0,hy);g.addColorStop(0,'#3FB4FF');g.addColorStop(1,'#B8ECFF');ctx.fillStyle=g;ctx.fillRect(0,0,W,hy+2);
  ctx.fillStyle='#fff';clouds.forEach(c=>{const x=((c.x+S.t*c.v)%1.3-.15)*W,y=c.y*H,s=c.s*Math.min(W,700)*.07;
    ctx.globalAlpha=.95;ctx.beginPath();ctx.arc(x,y,s,0,7);ctx.arc(x+s*1.1,y-s*.4,s*1.2,0,7);ctx.arc(x+s*2.3,y,s*.9,0,7);ctx.fill();ctx.fillRect(x,y,s*2.3,s*.9)});ctx.globalAlpha=1;
  const off=-camX*8;
  ctx.fillStyle='#8FDB76';hills.forEach(h=>{ctx.beginPath();ctx.ellipse(h.x+off*.5,hy+4,h.r,h.r*.32,0,Math.PI,0);ctx.fill()});
  city.forEach(b=>{const x=b.x+off,y=hy+3-b.h;ctx.fillStyle=b.c;ctx.fillRect(x,y,b.w,b.h);ctx.fillStyle='rgba(255,255,255,.55)';
    for(let wy=y+6;wy<hy-6;wy+=11)for(let wx=x+5;wx<x+b.w-6;wx+=10)ctx.fillRect(wx,wy,5,6);ctx.fillStyle='rgba(0,0,0,.08)';ctx.fillRect(x+b.w*.7,y,b.w*.3,b.h)});
}
function drawRoad(camX){ctx.fillStyle='#5CC24A';ctx.fillRect(0,hy,W,H-hy);
  const L=1.1,base=Math.floor(S.dist/L),n=Math.ceil(ZFAR/L);
  for(let k=n;k>=0;k--){const z1=(base+k+1)*L-S.dist;let z0=(base+k)*L-S.dist;if(z1<ZMIN)continue;if(z0<ZMIN)z0=ZMIN;
    const y0=projY(z0),y1=projY(z1),s0=P/z0,s1=P/z1,par=(base+k)&1;
    const X=(wx,s)=>cx+(wx-camX)*s;
    const quad=(a,b,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(X(a,s0),y0+.5);ctx.lineTo(X(b,s0),y0+.5);ctx.lineTo(X(b,s1),y1);ctx.lineTo(X(a,s1),y1);ctx.fill()};
    ctx.fillStyle=par?'#63C951':'#55B944';ctx.fillRect(0,y1,W,y0-y1+1);
    quad(-RH-CURB,RH+CURB,par?'#E8343A':'#FFFFFF');
    quad(-RH,RH,par?'#4C5263':'#495061');
    quad(-RH+.04,-RH+.09,'#F4F4F4');quad(RH-.09,RH-.04,'#F4F4F4');
    if(par){quad(-.53,-.47,'#FFFFFF');quad(.47,.53,'#FFFFFF')}
  }
  const g=ctx.createLinearGradient(0,hy,0,hy+40);g.addColorStop(0,'rgba(200,240,255,.85)');g.addColorStop(1,'rgba(200,240,255,0)');ctx.fillStyle=g;ctx.fillRect(0,hy,W,40);
}
function hash(n){const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)}
function sideObjects(camX,list){const SL=3.2,b=Math.floor(S.dist/SL);
  for(let j=b;j<b+ZFAR/SL;j++){const z=j*SL-S.dist;if(z<ZMIN+.2||z>ZFAR)continue;const h=hash(j),side=j%2?1:-1;
    if(h<.62){const x=side*(RH+CURB+.9+hash(j+3)*2.2);list.push({z,d:()=>tree(x,z,camX,.8+hash(j+5)*.5,h)})}
    else{const x=side*(RH+CURB+.3);list.push({z,d:()=>lamp(x,z,camX,side)})}
    if(hash(j+11)<.5){const x=-side*(RH+CURB+2.6+hash(j+9)*3);list.push({z:z+1.4,d:()=>tree(x,z+1.4,camX,1+hash(j+2)*.6,hash(j+8))})}}}
function tree(wx,z,camX,sz,h){const s=P/z,x=cx+(wx-camX)*s,y=projY(z);if(x<-200||x>W+200)return;
  ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(x,y,.5*sz*s,.12*sz*s,0,0,7);ctx.fill();
  ctx.fillStyle='#8A5A34';ctx.fillRect(x-.07*sz*s,y-.6*sz*s,.14*sz*s,.6*sz*s);
  const c=h<.3?['#2FA548','#47C25E']:h<.5?['#3DB04C','#6BD35A']:['#249A55','#3CBF6B'];
  ctx.fillStyle=c[0];ctx.beginPath();ctx.arc(x,y-.95*sz*s,.48*sz*s,0,7);ctx.fill();
  ctx.fillStyle=c[1];ctx.beginPath();ctx.arc(x-.14*sz*s,y-1.08*sz*s,.3*sz*s,0,7);ctx.fill()}
function lamp(wx,z,camX,side){const s=P/z,x=cx+(wx-camX)*s,y=projY(z);if(x<-200||x>W+200)return;
  ctx.strokeStyle='#7D8597';ctx.lineWidth=Math.max(1,.06*s);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-1.9*s);ctx.lineTo(x-side*.4*s,y-1.95*s);ctx.stroke();
  ctx.fillStyle='#FFE27A';ctx.beginPath();ctx.ellipse(x-side*.45*s,y-1.92*s,.12*s,.06*s,0,0,7);ctx.fill()}

function gateGeom(z,camX){const s=P/z,y=projY(z);return {s,y,X:wx=>cx+(wx-camX)*s}}
function drawGate(g,camX){const z=g.z-S.dist;if(z<ZMIN||z>ZFAR)return;const {s,y,X}=gateGeom(z,camX);
  const top=y-2.0*s;
  ctx.fillStyle='#D92F36';[-1.66,1.66].forEach(px=>{rr(X(px)-.06*s,top,.12*s,2.0*s,.04*s);ctx.fill()});
  rr(X(-1.75),top-.1*s,3.5*s,.2*s,.08*s);ctx.fillStyle='#E8343A';ctx.fill();
  ctx.fillStyle='#fff';for(let i=0;i<14;i++)if(i%2)ctx.fillRect(X(-1.7+i*.243),top-.05*s,.243*s,.1*s);
  for(let i=0;i<3;i++){if(g.broken===i)continue;const [col,dk]=COLORS[i];
    const sh=g.shake[i]>0?Math.sin(S.t*55)*g.shake[i]*.06*s:0;
    const pw=.86*s,ph=.98*s,px=X(i-1)-pw/2+sh,py=y-1.6*s;
    const dead=g.wrong.has(i);
    ctx.globalAlpha=dead?.45:1;
    rr(px,py,pw,ph,.1*s);ctx.fillStyle=col+'40';ctx.fill();
    ctx.lineWidth=Math.max(1.5,.07*s);ctx.strokeStyle=col;ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=Math.max(1,.03*s);ctx.beginPath();ctx.moveTo(px+pw*.2,py+ph*.95);ctx.lineTo(px+pw*.55,py+ph*.6);ctx.stroke();
    const lw=pw*.8,lh=ph*.5;rr(px+(pw-lw)/2,py+ph*.08,lw,lh,.07*s);ctx.fillStyle='#FFF9EE';ctx.fill();ctx.lineWidth=Math.max(1,.03*s);ctx.strokeStyle=dk;ctx.stroke();
    const fs=.42*s;if(fs>5){ctx.fillStyle='#1D2547';ctx.font=`700 ${fs}px AlBayan, serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';ctx.fillText(show(g.opts[i]),px+pw/2,py+ph*.08+lh*.46)}
    if(dead){ctx.strokeStyle='#F0504A';ctx.lineWidth=Math.max(2,.08*s);ctx.beginPath();const cxp=px+pw/2,cyp=py+ph*.72,r=.13*s;ctx.moveTo(cxp-r,cyp-r);ctx.lineTo(cxp+r,cyp+r);ctx.moveTo(cxp+r,cyp-r);ctx.lineTo(cxp-r,cyp+r);ctx.stroke()}
    ctx.globalAlpha=1}}
function drawFinish(f,camX){const z=f.z-S.dist;if(z<ZMIN||z>ZFAR)return;const {s,y,X}=gateGeom(z,camX);const top=y-2.2*s;
  ctx.fillStyle='#fff';[-1.7,1.7].forEach(px=>{rr(X(px)-.07*s,top,.14*s,2.2*s,.04*s);ctx.fill()});
  const bw=3.6*s,bh=.55*s,bx=X(-1.8),by=top-.2*s,cs=bh/2,cols=Math.ceil(bw/cs);
  for(let r=0;r<2;r++)for(let c=0;c<cols;c++){ctx.fillStyle=(r+c)%2?'#1D2547':'#fff';ctx.fillRect(bx+c*cs,by+r*cs,Math.min(cs,bx+bw-(bx+c*cs)),cs)}
  const lw=1.8*s;rr(X(0)-lw/2,by-.1*s,lw,bh+.2*s,.12*s);ctx.fillStyle='#FFC23D';ctx.fill();
  const fs=.4*s;if(fs>5){ctx.fillStyle='#1D2547';ctx.font=`700 ${fs}px AlBayan, serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';ctx.fillText('خط النهاية',X(0),by+bh*.42)}}

function drawStart(st,camX){const z=st.z-S.dist;if(z<ZMIN||z>ZFAR)return;const {s,y,X}=gateGeom(z,camX);
  // checkered start line painted on the road
  const rows=2,cols=12,dz=.16,w=2*RH/cols;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const z0=z+r*dz,z1=z+(r+1)*dz;if(z0<ZMIN)continue;
    const s0=P/z0,s1=P/z1,y0=projY(z0),y1=projY(z1),x0=-RH+c*w,x1=x0+w;
    ctx.fillStyle=(r+c)%2?'#1D2547':'#FFFFFF';ctx.beginPath();
    ctx.moveTo(cx+(x0-camX)*s0,y0);ctx.lineTo(cx+(x1-camX)*s0,y0);ctx.lineTo(cx+(x1-camX)*s1,y1);ctx.lineTo(cx+(x0-camX)*s1,y1);ctx.fill()}
  // gantry
  const top=y-2.3*s;ctx.fillStyle='#2A3156';
  [-1.72,1.72].forEach(px=>{rr(X(px)-.07*s,top,.14*s,2.3*s,.04*s);ctx.fill()});
  rr(X(-1.85),top-.08*s,3.7*s,.36*s,.1*s);ctx.fillStyle='#1D2547';ctx.fill();
  const lit=S.lights;for(let i=0;i<3;i++){const lx=X(-.5+i*.5),ly=top+.1*s,r=.12*s;
    ctx.fillStyle=lit===4?'#2DB86A':(i<lit?'#F0504A':'#3A4266');
    if(lit===4||i<lit){ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=.4*s}
    ctx.beginPath();ctx.arc(lx,ly,r,0,7);ctx.fill();ctx.shadowBlur=0}
  // side banners
  const fs=.24*s;if(fs>5){ctx.font=`700 ${fs}px AlBayan, serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';
    [[-1.3,'ابدأ'],[1.3,'انطلق']].forEach(([px,tx])=>{rr(X(px)-.3*s,top-.02*s,.6*s,.24*s,.06*s);ctx.fillStyle='#FFC23D';ctx.fill();ctx.fillStyle='#1D2547';ctx.fillText(tx,X(px),top+.1*s)})}}
function drawCar(){const s=P/CARZ,x=cx+(S.carX-S.camX)*s,w=carW,
  bounce=Math.sin(S.t*(S.speed>1?18:S.mode==='count'?30:9))*w*(S.mode==='count'?.014:.008),shake=S.shake>0?Math.sin(S.t*60)*S.shake*w*.06:0,y=carBottom+bounce;
  const tilt=(S.lane-1-S.carX)*.08;
  ctx.save();ctx.translate(x+shake,y);ctx.rotate(tilt);
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,0,w*.6,w*.1,0,0,7);ctx.fill();
  ctx.fillStyle='#22252F';rr(-w*.5,-w*.2,w*.2,w*.22,w*.05);ctx.fill();rr(w*.3,-w*.2,w*.2,w*.22,w*.05);ctx.fill();
  const bh=w*.38;
  ctx.fillStyle='#E8343A';rr(-w*.52,-w*.1-bh,w*1.04,bh,w*.12);ctx.fill();
  ctx.fillStyle='#B8202A';rr(-w*.52,-w*.16,w*1.04,w*.1,w*.05);ctx.fill();
  ctx.fillStyle='#E8343A';ctx.beginPath();ctx.moveTo(-w*.4,-w*.1-bh+2);ctx.lineTo(-w*.3,-w*.1-bh-w*.3);ctx.lineTo(w*.3,-w*.1-bh-w*.3);ctx.lineTo(w*.4,-w*.1-bh+2);ctx.fill();
  ctx.fillStyle='#fff';rr(-w*.32,-w*.1-bh-w*.36,w*.64,w*.09,w*.04);ctx.fill();
  ctx.fillStyle='#A8DEFF';ctx.beginPath();ctx.moveTo(-w*.33,-w*.1-bh-w*.02);ctx.lineTo(-w*.25,-w*.1-bh-w*.25);ctx.lineTo(w*.25,-w*.1-bh-w*.25);ctx.lineTo(w*.33,-w*.1-bh-w*.02);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.moveTo(-w*.18,-w*.1-bh-w*.04);ctx.lineTo(-w*.1,-w*.1-bh-w*.23);ctx.lineTo(-w*.02,-w*.1-bh-w*.23);ctx.lineTo(-w*.1,-w*.1-bh-w*.04);ctx.fill();
  ctx.fillStyle='#FFE27A';rr(-w*.46,-w*.38,w*.17,w*.1,w*.04);ctx.fill();rr(w*.29,-w*.38,w*.17,w*.1,w*.04);ctx.fill();
  ctx.fillStyle='#fff';rr(-w*.13,-w*.33,w*.26,w*.11,w*.03);ctx.fill();
  ctx.fillStyle='#1D2547';ctx.font=`700 ${w*.075}px AlBayan, serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('أ ب ت',0,-w*.28);
  ctx.restore();
  if(Math.abs(S.speed)<1.2){for(let i=0;i<3;i++){const o=(S.t*1.6+i/3)%1;ctx.globalAlpha=(1-o)*.5;ctx.fillStyle='#E9EEF6';
    ctx.beginPath();ctx.arc(x+w*.32+o*w*.18,y-w*.18-o*w*.25,w*(.04+o*.08),0,7);ctx.fill()}ctx.globalAlpha=1}
  if(S.speed>CRUISE*.9&&S.boost>0){ctx.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<3;i++){const o=(S.t*9+i/3)%1;ctx.globalAlpha=1-o;ctx.beginPath();ctx.arc(x+(i-1)*w*.3,y+o*w*.25,w*.05*(1+o),0,7);ctx.fill()}ctx.globalAlpha=1}}

function burst(i){const g=S.gate,z=Math.max(g.z-S.dist,CARZ+.1),{s,y,X}=gateGeom(z,S.camX);const px=X(i-1),py=y-1.1*s;
  for(let k=0;k<26;k++)parts.push({x:px+(Math.random()-.5)*.8*s,y:py+(Math.random()-.5)*s,vx:(Math.random()-.5)*900,vy:-200-Math.random()*600,r:Math.random()*6,vr:(Math.random()-.5)*14,sz:8+Math.random()*22,c:COLORS[i][Math.random()<.5?0:1],life:1.2,type:'shard'});
  for(let k=0;k<12;k++)parts.push({x:px,y:py,vx:(Math.random()-.5)*700,vy:-300-Math.random()*500,r:0,vr:(Math.random()-.5)*8,sz:14+Math.random()*14,c:'#FFD43D',life:1.4,type:'star'})}
function confetti(){const cs=['#FF8A1F','#2F8BFF','#9B5CF6','#2DB86A','#FFC23D','#E8343A'];
  for(let k=0;k<140;k++)parts.push({x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*120,vy:100+Math.random()*200,r:Math.random()*6,vr:(Math.random()-.5)*10,sz:7+Math.random()*9,c:rnd(cs),life:4,type:'shard',g:.2})}
function star(x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rad=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}ctx.closePath();ctx.fill()}
function drawParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0||p.y>H+50){parts.splice(i,1);continue}
  p.vy+=1400*(p.g||1)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;ctx.save();ctx.globalAlpha=Math.min(1,p.life*2);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
  if(p.type==='star')star(0,0,p.sz/2);else ctx.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2);ctx.restore()}}

/* ---------- Loop ---------- */
S.camX=0;let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;S.t+=dt;
  let tgt=4.5;
  if(S.mode==='play'){if(S.finish)tgt=CRUISE*1.2;else if(S.gate&&!S.gate.done){const gz=S.gate.z-S.dist;tgt=S.chosen>=0?CRUISE*1.15:Math.max(-4,Math.min(CRUISE,(gz-STOP)*2.2))}else tgt=CRUISE}
  else if(S.mode==='done')tgt=CRUISE*.8;
  else if(S.start){tgt=Math.max(0,Math.min(CRUISE,(S.start.z-S.dist-GRID)*2.2));if(S.mode==='count')tgt=0;
    if(S.mode==='grid'&&Math.abs(S.speed)<.25&&S.start.z-S.dist-GRID<.4)countdown()}
  S.speed+=(tgt-S.speed)*Math.min(1,dt*2.6);S.dist+=S.speed*dt;
  S.carX+=((S.lane-1)-S.carX)*Math.min(1,dt*5);S.camX=S.carX*.35;
  S.shake=Math.max(0,S.shake-dt*2.2);S.boost=Math.max(0,S.boost-dt*.7);
  const g=S.gate;
  if(g){for(let i=0;i<3;i++)g.shake[i]=Math.max(0,g.shake[i]-dt*1.8);
    if(S.mode==='play'&&!g.done&&S.chosen>=0&&g.z-S.dist<=CARZ+.65)hitGate();
    if(g.done&&g.z-S.dist<ZMIN&&S.gate===g)S.gate=null}
  if(S.finish&&S.mode==='play'&&S.finish.z-S.dist<=CARZ)finishRace();
  if(S.finish&&S.finish.z-S.dist<ZMIN&&S.mode!=='play')S.finish=null;

  drawSky(S.camX);drawRoad(S.camX);
  const list=[];sideObjects(S.camX,list);
  if(g)list.push({z:g.z-S.dist,d:()=>drawGate(g,S.camX)});
  if(S.finish){const f=S.finish;list.push({z:f.z-S.dist,d:()=>drawFinish(f,S.camX)})}
  if(S.start){const st=S.start;if(st.z-S.dist<ZMIN&&S.mode==='play')S.start=null;else list.push({z:st.z-S.dist,d:()=>drawStart(st,S.camX)})}
  for(const c of coins){if(!c.got&&c.z-S.dist<=CARZ+.25&&Math.abs(c.x-S.carX)<.55)collect(c)}
  coins=coins.filter(c=>!c.got&&c.z-S.dist>ZMIN);
  for(const c of coins)list.push({z:c.z-S.dist,d:()=>drawCoin(c,S.camX)});
  list.sort((a,b)=>b.z-a.z);
  list.forEach(o=>{if(o.z>=CARZ)o.d()});drawCar();list.forEach(o=>{if(o.z<CARZ)o.d()});
  drawParts(dt);
  requestAnimationFrame(frame)}
addEventListener('resize',resize);
const go=()=>{setMode('menu');resize();requestAnimationFrame(t=>{last=t;frame(t)})};
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load('700 20px AlBayan'),document.fonts.load('400 20px AlBayan')]).catch(()=>{}):Promise.resolve()).then(go);
})();
</script>

</body></html>
